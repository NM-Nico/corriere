<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medic Air</title>
<meta name="theme-color" content="#0A7CC1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#E6EEF4; --surface:#FFFFFF; --surface2:#F2F6F9; --ink:#12202E; --muted:#526477; --line:#CEDAE4;
  --oxy:#0A7CC1; --oxy-ink:#FFFFFF; --oxy-soft:#DCEEFA; --focus:#F59E0B;
  --late:#B3261E; --late-soft:#FCE7E4; --later:#8F5200; --later-soft:#FBEBD2;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-cond:"Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131A; --surface:#15202A; --surface2:#1B2833; --ink:#E6EEF4; --muted:#9AAEBF; --line:#293847;
    --oxy:#2F8FD0; --oxy-ink:#FFFFFF; --oxy-soft:#153249; --focus:#FBBF24;
    --late:#FF7A6E; --late-soft:#3A1D1A; --later:#F2AE4B; --later-soft:#3A2B15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#15202A; --surface2:#1B2833; --ink:#E6EEF4; --muted:#9AAEBF; --line:#293847;
  --oxy:#2F8FD0; --oxy-ink:#FFFFFF; --oxy-soft:#153249; --focus:#FBBF24;
  --late:#FF7A6E; --late-soft:#3A1D1A; --later:#F2AE4B; --later-soft:#3A2B15;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}
.app{max-width:760px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* Header del giro */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--oxy);color:var(--oxy-ink);padding:5px 8px 7px}
.top-row{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:4px}
.icon-btn{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:42px;line-height:1}
.icon-btn:active{background:rgba(255,255,255,.15)}
.top-date{text-align:center;min-width:0}
.top-date h1{margin:0;font:600 25px/1.02 var(--f-cond);letter-spacing:.005em}
.top-date .when{font-size:13px;opacity:.85;min-height:0;line-height:1.2}
.top-date button.pick{padding:2px 8px;border-radius:8px}
.back-today{display:inline-block;margin-top:2px;font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18)}
.week{display:flex;gap:4px;margin-top:6px}
.wd{flex:1;min-width:0;border-radius:10px;padding:4px 2px 4px;text-align:center;background:rgba(255,255,255,.1);position:relative}
.wd .d1{display:block;font-size:12px;opacity:.85}
.wd .d2{display:block;font:600 20px/1.1 var(--f-cond)}
.wd .n{display:block;font-size:12px;font-weight:600;opacity:.9}
.wd.sel{background:var(--surface);color:var(--oxy)}
.wd.today::after{content:"";position:absolute;left:50%;top:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.wd.has-late .n{color:#FFD9D4}
.wd.sel.has-late .n{color:var(--late)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--surface);padding:10px 6px 9px;text-align:center}
.stat b{display:block;font:700 28px/1 var(--f-cond)}
.stat span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.stat-btn{position:relative}
.stat-btn span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.stat-btn.warn b{color:var(--later)}

/* Liste */
.sec{padding:18px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{margin:0;font:600 22px/1.1 var(--f-cond)}
.sec .c{font-size:14px;color:var(--muted);white-space:nowrap}
.sec.late h2,.sec.late .c{color:var(--late)}
.sec-note{padding:0 14px 8px;font-size:14px;color:var(--muted)}
.list{background:var(--surface);border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line);min-height:64px}
.row.late{background:var(--late-soft)}
.check{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--oxy);display:grid;place-items:center;margin:0 auto;background:var(--surface)}
.check svg{width:24px;height:24px;opacity:0;grid-area:1/1}
.check .seqn{grid-area:1/1;font:700 21px/1 var(--f-cond);color:var(--oxy)}
.seq-bar{margin:8px 10px;padding:10px 12px;border-radius:12px;background:var(--oxy);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.seq-bar .t{flex:1 1 100%;font-weight:600;font-size:15px}
.seq-bar .btn{min-height:40px;padding:0 12px;font-size:14px}
.seq-bar .btn.w{background:#fff;color:var(--oxy);border-color:#fff}
.seq-bar .btn.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.seq-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px 8px 8px;border:0;border-bottom:1px solid var(--line);background:var(--surface);min-height:60px;font:inherit;color:inherit}
.seq-row .num{width:44px;height:44px;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center;font:700 21px/1 var(--f-cond);margin:0 auto;color:var(--muted)}
.seq-row.on .num{border-style:solid;border-color:var(--oxy);background:var(--oxy);color:#fff}
.seq-row .nome{font-weight:700;display:block}
.seq-row .loc{font:600 17px/1.1 var(--f-cond);text-align:right}
.seq-tools{display:flex;justify-content:flex-end;padding:6px 12px 0}
.seq-tools .btn{min-height:38px;font-size:14px;padding:0 12px}
.check:active{background:var(--oxy-soft)}
.row.late .check{border-color:var(--late)}
.row.done .check{background:var(--oxy);border-color:var(--oxy);color:#fff;cursor:default}
.row.done .check svg{opacity:1}
.row-main{display:flex;flex-direction:column;justify-content:center;min-height:48px;min-width:0;padding:2px 4px}
.nome{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted);line-height:1.3}
.meta .lt{color:var(--late);font-weight:600}
.meta .rv{color:var(--later);font-weight:600}
.note{font-size:14px;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.row.done .nome{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.row.done .cnt{opacity:.55}
.undo-btn{font-size:14px;font-weight:600;color:var(--oxy);padding:8px 4px;text-align:left}

.cnt{font:700 24px/1 var(--f-cond);min-width:54px;padding:5px 8px 6px;text-align:center;border:2px solid var(--ink);border-top-width:7px;border-radius:14px 14px 6px 6px;background:var(--surface);white-space:nowrap;color:var(--ink)}
.cnt.long{font-size:17px;min-width:0;padding:6px 6px}
.cnt.warn{border-color:var(--late);color:var(--late)}
.cnt.sm{font-size:18px;min-width:44px;border-top-width:5px;padding:3px 6px 4px;border-radius:11px 11px 5px 5px}
.cnt.sm.long{font-size:14px}

.empty{padding:36px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 22px/1.2 var(--f-cond);margin-bottom:6px}
.foot-actions{padding:18px 14px;display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--oxy);border-color:var(--oxy);color:var(--oxy-ink)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.block{display:flex;width:100%}
.btn small{font-weight:500;opacity:.8}
.btn:disabled{opacity:.45;cursor:default}

.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;height:54px;padding:0 22px 0 18px;border-radius:27px;background:var(--ink);color:var(--bg);font:600 20px/1 var(--f-cond);display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab svg{width:22px;height:22px}

/* Navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.prof-head{display:flex;align-items:center;gap:14px}
.nav-in.molti button span{font-size:10.5px}
.nav-in.molti button svg{width:22px;height:22px}
.adm-row{display:flex;gap:12px;align-items:flex-start}
.adm-row .avatar{width:44px;height:44px;font-size:17px}
.adm-row .nm{font:700 19px/1.15 var(--f-cond)}
.adm-row .mt{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.adm-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.adm-acts .btn{min-height:40px;padding:0 12px;font-size:14px}
.tag.adm{background:#FDE8D7;color:#9A3412}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;background:var(--oxy);color:#fff;display:grid;place-items:center;font:700 23px/1 var(--f-cond);letter-spacing:.02em}
.prof-head .pn{font:700 22px/1.1 var(--f-cond)}
.prof-head .pm{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.pw-row{position:relative}
.pw-row input{padding-right:84px}
.pw-eye{position:absolute;right:6px;bottom:6px;height:36px;padding:0 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--oxy);background:none;border:0}
.nav button span{font-size:12px}
.tag.vc{background:#D8F1EC;color:#0D6457}
.tag.rs{background:#EEE6F7;color:#5B3A8C}
:root[data-theme="dark"] .tag.rs{background:#2E2340;color:#CDB6F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.rs{background:#2E2340;color:#CDB6F0}}
:root[data-theme="dark"] .tag.vc{background:#123A34;color:#8FDCCB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.vc{background:#123A34;color:#8FDCCB}}
.vrow{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
.vrow-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.vrow .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vrow .btns .btn{min-height:44px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:13px;font-weight:600;color:var(--muted);min-height:58px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--oxy)}
.nav button{position:relative}
.nav .badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:3px}

/* Pagine */
.page-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.page-h h1{margin:0;font:600 30px/1 var(--f-cond);flex:1}
.page-h .sub{font-size:14px;color:var(--muted)}
.search{padding:12px 14px 4px}
.search input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{border-color:var(--late);color:var(--late)}
.chip.warn[aria-pressed="true"]{background:var(--late);color:#fff}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.more{display:block;width:100%;padding:16px;text-align:center;font-weight:600;color:var(--oxy)}
.hday{padding:16px 14px 6px;font:600 20px/1.1 var(--f-cond)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:4px;vertical-align:1px}
.tag.ok{background:var(--oxy-soft);color:var(--oxy)}
.tag.rv{background:var(--later-soft);color:var(--later)}
.tag.ag{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 14px;padding:14px}
.card h3{margin:0 0 4px;font:600 21px/1.15 var(--f-cond)}
.card p{margin:0 0 10px;color:var(--muted);font-size:15px}
.card .btn{margin:4px 6px 0 0}
.dup{display:grid;gap:8px;margin:8px 0}
.dup > div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
.banner{margin:10px 14px 0;padding:12px 14px;border-radius:12px;background:var(--late-soft);color:var(--late);font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;width:calc(100% - 28px);text-align:left}

/* Sheet */
.sheet-root{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(8,16,12,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{margin:0 44px 4px 0;font:600 26px/1.1 var(--f-cond);overflow-wrap:anywhere}
.sheet .lead{margin:0 0 14px;color:var(--muted)}
.sheet-close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:22px;font-size:28px;line-height:1;display:grid;place-items:center;color:var(--muted)}
.acts{display:grid;gap:10px}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;font-size:17px;text-align:left}
.act small{font-weight:500;color:var(--muted);font-size:15px}
.act.go{background:var(--oxy);border-color:var(--oxy);color:var(--oxy-ink)}
.act.go small{color:inherit;opacity:.85}
.act.rv{border-color:var(--later);color:var(--later)}
.field{display:block;margin:0 0 12px}
.field > span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);padding:8px 12px;font-size:17px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{height:36px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);font:600 17px/1 var(--f-cond)}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}
.warnbox{border-radius:10px;padding:10px 12px;background:var(--later-soft);color:var(--later);font-size:15px;margin:0 0 12px}
.okbox{border-radius:10px;padding:10px 12px;background:var(--oxy-soft);color:var(--oxy);font-size:15px;margin:0 0 12px;font-weight:600}
.errbox{border-radius:10px;padding:10px 12px;background:var(--late-soft);color:var(--late);font-size:15px;margin:0 0 12px;font-weight:600}
.checkline{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:15px}
.checkline input{width:22px;height:22px;margin-top:1px;flex:none}
.res{border-top:1px solid var(--line);margin-top:8px}
.res-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res-row .btn{min-height:42px;padding:0 14px}
table.carico{width:100%;border-collapse:collapse;margin:6px 0 14px}
table.carico td{padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px}
table.carico td:last-child{text-align:right;font:700 24px/1 var(--f-cond)}
table.carico tr.tot td{border-bottom:0;font-weight:700}
.map-prev{overflow-x:auto;margin:8px 0 14px}
.map-prev table{border-collapse:collapse;font-size:13px}
.map-prev td,.map-prev th{border:1px solid var(--line);padding:4px 6px;white-space:nowrap;text-align:left}

.toast{position:fixed;left:12px;right:12px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast span{flex:1;font-size:15px}
.toast button{font-weight:700;color:var(--oxy-soft);padding:8px 6px;white-space:nowrap}
:root[data-theme="dark"] .toast button{color:var(--oxy)}
.storage-warn{margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:var(--late-soft);color:var(--late);font-size:14px;font-weight:600}
.sr-date{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.prose{padding:4px 16px 10px;font-size:15px;line-height:1.5;max-width:68ch}
.prose h3{font:600 20px/1.2 var(--f-cond);margin:14px 0 4px}
.prose p{margin:0 0 8px}


.row{grid-template-columns:50px minmax(0,1fr) auto auto;gap:6px}
@media (min-width:560px){
  .row{grid-template-columns:50px minmax(0,1fr) auto minmax(0,1fr) auto}
  .row > .loc{grid-column:3;max-width:220px;font-size:22px}
  .row > .loc.long{font-size:22px}
  .row > .cnt,.row > .badges{grid-column:5}
}
.row .loc{text-align:center;font:700 20px/1.05 var(--f-cond);text-transform:uppercase;letter-spacing:.01em;color:var(--ink);max-width:132px;overflow-wrap:normal;word-break:normal;padding:0 2px}
.row .loc.long{font-size:18px}
@media (min-width:560px){.row .loc,.row .loc.long{max-width:220px;font-size:22px}}
.row.late .loc{color:var(--late)}
.row.done .loc{color:var(--muted)}
.brand{display:flex;justify-content:center;margin:0 0 4px}
.brand img{height:40px;width:auto;background:#fff;border-radius:11px;padding:6px 16px;box-sizing:content-box;display:block;max-width:48vw;object-fit:contain}
.credit{text-align:center;font-size:13px;color:var(--muted);padding:26px 16px 8px}
.splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash img{width:min(78vw,380px);height:auto}
.splash .bar{width:min(64vw,300px);height:8px;border-radius:4px;background:#E3EDF5;overflow:hidden}
.splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0A7CC1,#29A8E0);border-radius:4px;animation:carica 5s cubic-bezier(.35,.1,.25,1) forwards}
.splash .bar i.fine{animation:none;width:100% !important;transition:width .35s ease-out}
@keyframes carica{0%{width:0}35%{width:40%}55%{width:55%}80%{width:78%}100%{width:90%}}
.splash .lbl.upd{color:#0A7CC1;font-weight:700}
.credit .ver{display:block;margin-top:3px;font-size:12px;opacity:.85}
.splash .lbl{font:500 15px var(--f-body);color:#526477;min-height:20px}
.splash .credit{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));color:#7A8C9D}
.login{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px))}
.login-in{width:100%;max-width:400px;margin:auto 0}
.login-in img{display:block;height:54px;margin:0 auto 22px;background:#fff;border-radius:12px;padding:8px 14px;box-sizing:content-box}
.login-in h1{text-align:center;font:600 34px var(--f-cond);color:var(--oxy)}
.login-in h2{margin:0 0 16px;font:600 30px/1 var(--f-cond);text-align:center}
.login-in .credit{padding-top:34px}
.badges{display:flex;align-items:center;gap:5px}
.bwrap{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;display:block;cursor:pointer}
.bwrap:active{opacity:.55;transform:scale(.94)}
.giro-nota{max-width:46vw;min-height:44px;padding:6px 10px;border:2px solid #b45309;border-radius:10px;background:#fff7ed;color:#9a3412;font:700 16px/1.15 var(--f-cond);text-transform:uppercase;text-align:center;white-space:normal;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .giro-nota{background:#3b2410;color:#fdba74;border-color:#c2410c}}
:root[data-theme="dark"] .giro-nota{background:#3b2410;color:#fdba74;border-color:#c2410c}
.fgb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;padding:3px 5px 4px;border:2px solid var(--muted);border-top-width:5px;border-radius:11px 11px 6px 6px;background:var(--surface);line-height:1;color:var(--ink)}
.fgb small{font:700 9.5px/1 var(--f-body);color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.fgb b{font:700 19px/1 var(--f-cond)}
.row.done .fgb{opacity:.55}
.cnt.gas{border-color:#C2410C;color:#C2410C}
:root[data-theme="dark"] .cnt.gas{border-color:#FB923C;color:#FB923C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cnt.gas{border-color:#FB923C;color:#FB923C}}
.badge.or{background:#E07A00}
.gasrow{display:flex;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface2)}
.stepper b{font:700 18px var(--f-cond);color:#C2410C;margin-right:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:700 22px/1 var(--f-body)}
.stepper output{min-width:24px;text-align:center;font:700 20px var(--f-cond)}
.gasm{color:#C2410C;font-weight:700}
:root[data-theme="dark"] .gasm{color:#FB923C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gasm{color:#FB923C}}
.row .row-main{min-width:88px}
@media (max-width:559px){.row{gap:4px;padding-right:8px}.row .loc{max-width:104px;font-size:18px}.row .loc.long{font-size:15.5px}.badges{flex-direction:column;align-items:stretch;gap:3px}.fgb{flex-direction:row;gap:3px;padding:1px 6px 2px;border-width:1.5px;border-top-width:1.5px;border-radius:7px;min-width:0}.fgb small{margin:0;font-size:9px}.fgb b{font-size:15px}}
.vista-banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#E07A00;color:#fff;padding:8px 12px;font-size:15px}
.vista-banner button{background:#fff;color:#B45F00;font-weight:700;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
body.altrui .top{top:calc(env(safe-area-inset-top,0px) + 44px)}
.vett-bar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;z-index:2;max-width:27vw;display:flex;flex-wrap:wrap;column-gap:4px;align-items:baseline;color:#fff;font-size:13px;line-height:1.2}
.vett-bar span{opacity:.85}
.vett-bar b{font:700 16px/1.15 var(--f-cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.corr-bar{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:2}
.corr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;max-width:44vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.corr-btn svg{width:16px;height:16px;flex:none}
.wd-in{display:flex;align-items:center;justify-content:center;gap:4px}
.wd-dt{display:block}
.wd .wx{display:flex;flex-direction:column;align-items:center;line-height:1}
.wd .wx i{font-style:normal;font-size:15px}
.wd .wx b{font:600 11px/1.2 var(--f-body);opacity:.95}
@media (max-width:399px){.wd-in{gap:2px}.wd .wx i{font-size:13px}.wd .wx b{font-size:10px}.wd .d1{font-size:11px}}
#print-area{display:none}
@media print{
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important}
  body{background:#fff;color:#000}
  :root{padding:0}
}
</style>

const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function cap(s){return s ? s.charAt(0).toUpperCase()+s.slice(1) : s}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function isoFromDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return isoFromDate(new Date())}
function toUTC(iso){const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)}
function fromUTC(t){const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(iso,n){return fromUTC(toUTC(iso)+n*864e5)}
function diffDays(a,b){return Math.round((toUTC(a)-toUTC(b))/864e5)}
function wd(iso){return new Date(toUTC(iso)).getUTCDay()}
function dm(iso){const [y,m,d]=iso.split('-').map(Number);return {y,m,d}}
function fmtLong(iso){const {m,d}=dm(iso);return cap(GIORNI[wd(iso)])+' '+d+' '+MESI[m-1]}
function fmtShort(iso){if(!iso) return '—';const {m,d}=dm(iso);return GB[wd(iso)].toLowerCase()+' '+d+' '+MB[m-1]}
function fmtNum(iso){if(!iso) return '';const {y,m,d}=dm(iso);return pad(d)+'/'+pad(m)+'/'+String(y).slice(2)}
function validISO(s){return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(toUTC(s))}
function parseDateAny(v){
  const s=String(v ?? '').trim(); if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return fixDate(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){let y=+m[3]; if(y<100) y+=2000; return fixDate(y,+m[2],+m[1]);}
  if(/^\d{5}(\.\d+)?$/.test(s)){return fromUTC(Date.UTC(1899,11,30)+Math.floor(+s)*864e5)}
  return '';
}
function fixDate(y,m,d){if(m<1||m>12||d<1||d>31) return '';const iso=y+'-'+pad(m)+'-'+pad(d);return fromUTC(toUTC(iso))===iso?iso:''}
function normGiorno(s){
  const t=normTxt(s).toLowerCase().slice(0,3);
  const map={dom:0,lun:1,mar:2,mer:3,gio:4,ven:5,sab:6};
  return t in map ? GIORNI[map[t]] : '';
}
function toFG(v){const n=parseInt(String(v ?? '').replace(/[^\d]/g,''),10);return n>0&&n<400?n:0}
function cleanCnt(v){return String(v ?? '').toUpperCase().replace(/\s+/g,'').replace(/\*/g,'X')}
function surname(p){return normTxt(p.nome).split(' ')[0]||''}
function locKey(p){return normTxt(String(p.localita||'').replace(/\//g,' ')).split(' ')[0]||''}

/* ---------- stato ---------- */
let storageOK = true;
let S = null;
const ui = {tab:'giro', day:todayISO(), follow:true, q:'', filtro:'tutti', hf:'consegna', hq:'', hlim:200};

function fromRow(r){
  const p = {
    id: uid(),
    nome: String(r.nome ?? r.NOME ?? '').trim().toUpperCase(),
    localita: String(r.localita ?? r.LOCALITA ?? '').trim().toUpperCase(),
    cnt: cleanCnt(r.cnt ?? r.CNT),
    fg: toFG(r.fg ?? r.FG),
    giorno: normGiorno(r.giorno ?? r.GIORNO_FISSO),
    ultima: parseDateAny(r.ultima ?? r.ULTIMA_VISITA),
    prossima: parseDateAny(r.prossima ?? r.PROSSIMA_VISITA),
    note: String(r.note ?? r.NOTE ?? '').trim(),
    spostata: null
  };
  if(!p.prossima && p.ultima && p.fg) p.prossima = addDays(p.ultima,p.fg);
  const rv = parseDateAny(r.rinvio ?? r.RINVIO);
  if(rv) p.spostata = {data:rv, motivo:'rinvio'};
  const vd = parseDateAny(r.vacanza_dal ?? r.VACANZA_DAL), va = parseDateAny(r.vacanza_al ?? r.VACANZA_AL);
  if(vd || va) p.vacanza = {dal:vd||todayISO(), al:va||'', nota:''};
  p.gruppo = gruppoDa(r.gruppo ?? r.GRUPPO, p.note);
  { const g=gasDa(r.gassosi ?? r.GASSOSI); if(g) p.gas=g; }
  const rd=parseDateAny(r.reso_dal ?? r.RESO_DAL), rr=parseDateAny(r.reso_ritiro ?? r.RESO_RITIRO), rt=parseDateAny(r.reso_ritirato ?? r.RESO_RITIRATO);
  if(rd||rr||rt){ p.reso={dal:rd||todayISO(), ritiro:rr||'', ritirato:rt||'', cnt:p.cnt, nota:''}; p.vacanza=null; }
  if(!p.giorno && p.prossima) p.giorno = GIORNI[wd(p.prossima)];
  return p;
}
function gasDa(v){
  const g={}; const t=String(v??'').toUpperCase();
  for(const m of t.matchAll(/(?:(\d+)\s*[X×*]\s*)?(3000|6000)/g)){ g[m[2]]=(g[m[2]]||0)+(+(m[1]||1)); }
  return Object.keys(g).length?g:null;
}
function gasTesto(g,sep){ if(!g) return ''; return TIPI_GAS.filter(t=>g[t]).map(t=>`${g[t]}${sep||'×'}${t}`).join(' + '); }
function gruppoDa(g,note){
  const t=String(g ?? '').trim();
  if(t) return cap(t.toLowerCase());
  const m=String(note||'').toUpperCase().match(/GRUPPO\s+([A-ZÀ-Ú][A-ZÀ-Ú' ]*)/);
  return m?cap(m[1].trim().toLowerCase()):'';
}

    }
    st.patch.push('gas1');
  }
  if(!st.patch.includes('gruppi1')){ for(const p of st.pazienti){ if(!p.gruppo) p.gruppo=gruppoDa('',p.note); } st.patch.push('gruppi1'); }
  { const T=todayISO(); for(const p of st.pazienti){ if(p.extra){ p.extra=p.extra.filter(d=>d>=T); if(!p.extra.length) delete p.extra; } } }

      p.note=n;
    }
    st.patch.push('note1');
  }
  const match=(p,[n,l,d])=>normTxt(p.nome)===normTxt(n)&&normTxt(p.localita)===normTxt(l)&&p.prossima===d&&!p.spostata;
  let fatte=0;
  for(const pt of PATCHES){
    if(st.patch.includes(pt.id)) continue;
    for(const op of pt.ops){
      if(op.del){const i=st.pazienti.findIndex(p=>match(p,op.del)); if(i>=0){st.pazienti.splice(i,1);fatte++}}
      if(op.set){const p=st.pazienti.find(p=>match(p,op.set)); if(p){Object.assign(p,op.v);fatte++}}
      if(op.fatto){const p=st.pazienti.find(p=>match(p,op.fatto)); if(p&&p.fg){

        const prima=snap(p), next=addDays(last,p.fg);

        fatte++}}
    }
    st.patch.push(pt.id);
  }
  return fatte;
}
