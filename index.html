<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medic Air</title>
<meta name="theme-color" content="#0A7CC1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#E6EEF4; --surface:#FFFFFF; --surface2:#F2F6F9; --ink:#12202E; --muted:#526477; --line:#CEDAE4;
  --oxy:#0A7CC1; --oxy-ink:#FFFFFF; --oxy-soft:#DCEEFA; --focus:#F59E0B;
  --late:#B3261E; --late-soft:#FCE7E4; --later:#8F5200; --later-soft:#FBEBD2;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-cond:"Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131A; --surface:#15202A; --surface2:#1B2833; --ink:#E6EEF4; --muted:#9AAEBF; --line:#293847;
    --oxy:#2F8FD0; --oxy-ink:#FFFFFF; --oxy-soft:#153249; --focus:#FBBF24;
    --late:#FF7A6E; --late-soft:#3A1D1A; --later:#F2AE4B; --later-soft:#3A2B15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#15202A; --surface2:#1B2833; --ink:#E6EEF4; --muted:#9AAEBF; --line:#293847;
  --oxy:#2F8FD0; --oxy-ink:#FFFFFF; --oxy-soft:#153249; --focus:#FBBF24;
  --late:#FF7A6E; --late-soft:#3A1D1A; --later:#F2AE4B; --later-soft:#3A2B15;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}
.app{max-width:760px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* Header del giro */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--oxy);color:var(--oxy-ink);padding:5px 8px 7px}
.top-row{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:4px}
.icon-btn{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:42px;line-height:1}
.icon-btn:active{background:rgba(255,255,255,.15)}
.top-date{text-align:center;min-width:0}
.top-date h1{margin:0;font:600 25px/1.02 var(--f-cond);letter-spacing:.005em}
.top-date .when{font-size:13px;opacity:.85;min-height:0;line-height:1.2}
.top-date button.pick{padding:2px 8px;border-radius:8px}
.back-today{display:inline-block;margin-top:2px;font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18)}
.week{display:flex;gap:4px;margin-top:6px}
.wd{flex:1;min-width:0;border-radius:10px;padding:4px 2px 4px;text-align:center;background:rgba(255,255,255,.1);position:relative}
.wd .d1{display:block;font-size:12px;opacity:.85}
.wd .d2{display:block;font:600 20px/1.1 var(--f-cond)}
.wd .n{display:block;font-size:12px;font-weight:600;opacity:.9}
.wd.sel{background:var(--surface);color:var(--oxy)}
.wd.today::after{content:"";position:absolute;left:50%;top:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.wd.has-late .n{color:#FFD9D4}
.wd.sel.has-late .n{color:var(--late)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--surface);padding:10px 6px 9px;text-align:center}
.stat b{display:block;font:700 28px/1 var(--f-cond)}
.stat span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.stat-btn{position:relative}
.stat-btn span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.stat-btn.warn b{color:var(--later)}

/* Liste */
.sec{padding:18px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{margin:0;font:600 22px/1.1 var(--f-cond)}
.sec .c{font-size:14px;color:var(--muted);white-space:nowrap}
.sec.late h2,.sec.late .c{color:var(--late)}
.sec-note{padding:0 14px 8px;font-size:14px;color:var(--muted)}
.list{background:var(--surface);border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line);min-height:64px}
.row.late{background:var(--late-soft)}
.check{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--oxy);display:grid;place-items:center;margin:0 auto;background:var(--surface)}
.check svg{width:24px;height:24px;opacity:0}
.check:active{background:var(--oxy-soft)}
.row.late .check{border-color:var(--late)}
.row.done .check{background:var(--oxy);border-color:var(--oxy);color:#fff;cursor:default}
.row.done .check svg{opacity:1}
.row-main{display:flex;flex-direction:column;justify-content:center;min-height:48px;min-width:0;padding:2px 4px}
.nome{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted);line-height:1.3}
.meta .lt{color:var(--late);font-weight:600}
.meta .rv{color:var(--later);font-weight:600}
.note{font-size:14px;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.row.done .nome{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.row.done .cnt{opacity:.55}
.undo-btn{font-size:14px;font-weight:600;color:var(--oxy);padding:8px 4px;text-align:left}

.cnt{font:700 24px/1 var(--f-cond);min-width:54px;padding:5px 8px 6px;text-align:center;border:2px solid var(--ink);border-top-width:7px;border-radius:14px 14px 6px 6px;background:var(--surface);white-space:nowrap;color:var(--ink)}
.cnt.long{font-size:17px;min-width:0;padding:6px 6px}
.cnt.warn{border-color:var(--late);color:var(--late)}
.cnt.sm{font-size:18px;min-width:44px;border-top-width:5px;padding:3px 6px 4px;border-radius:11px 11px 5px 5px}
.cnt.sm.long{font-size:14px}

.empty{padding:36px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 22px/1.2 var(--f-cond);margin-bottom:6px}
.foot-actions{padding:18px 14px;display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--oxy);border-color:var(--oxy);color:var(--oxy-ink)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.block{display:flex;width:100%}
.btn small{font-weight:500;opacity:.8}
.btn:disabled{opacity:.45;cursor:default}

.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;height:54px;padding:0 22px 0 18px;border-radius:27px;background:var(--ink);color:var(--bg);font:600 20px/1 var(--f-cond);display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab svg{width:22px;height:22px}

/* Navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.prof-head{display:flex;align-items:center;gap:14px}
.nav-in.molti button span{font-size:10.5px}
.nav-in.molti button svg{width:22px;height:22px}
.adm-row{display:flex;gap:12px;align-items:flex-start}
.adm-row .avatar{width:44px;height:44px;font-size:17px}
.adm-row .nm{font:700 19px/1.15 var(--f-cond)}
.adm-row .mt{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.adm-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.adm-acts .btn{min-height:40px;padding:0 12px;font-size:14px}
.tag.adm{background:#FDE8D7;color:#9A3412}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;background:var(--oxy);color:#fff;display:grid;place-items:center;font:700 23px/1 var(--f-cond);letter-spacing:.02em}
.prof-head .pn{font:700 22px/1.1 var(--f-cond)}
.prof-head .pm{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.pw-row{position:relative}
.pw-row input{padding-right:84px}
.pw-eye{position:absolute;right:6px;bottom:6px;height:36px;padding:0 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--oxy);background:none;border:0}
.nav button span{font-size:12px}
.tag.vc{background:#D8F1EC;color:#0D6457}
.tag.rs{background:#EEE6F7;color:#5B3A8C}
:root[data-theme="dark"] .tag.rs{background:#2E2340;color:#CDB6F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.rs{background:#2E2340;color:#CDB6F0}}
:root[data-theme="dark"] .tag.vc{background:#123A34;color:#8FDCCB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.vc{background:#123A34;color:#8FDCCB}}
.vrow{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
.vrow-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.vrow .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vrow .btns .btn{min-height:44px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:13px;font-weight:600;color:var(--muted);min-height:58px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--oxy)}
.nav button{position:relative}
.nav .badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:3px}

/* Pagine */
.page-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.page-h h1{margin:0;font:600 30px/1 var(--f-cond);flex:1}
.page-h .sub{font-size:14px;color:var(--muted)}
.search{padding:12px 14px 4px}
.search input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{border-color:var(--late);color:var(--late)}
.chip.warn[aria-pressed="true"]{background:var(--late);color:#fff}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.more{display:block;width:100%;padding:16px;text-align:center;font-weight:600;color:var(--oxy)}
.hday{padding:16px 14px 6px;font:600 20px/1.1 var(--f-cond)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:4px;vertical-align:1px}
.tag.ok{background:var(--oxy-soft);color:var(--oxy)}
.tag.rv{background:var(--later-soft);color:var(--later)}
.tag.ag{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 14px;padding:14px}
.card h3{margin:0 0 4px;font:600 21px/1.15 var(--f-cond)}
.card p{margin:0 0 10px;color:var(--muted);font-size:15px}
.card .btn{margin:4px 6px 0 0}
.dup{display:grid;gap:8px;margin:8px 0}
.dup > div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
.banner{margin:10px 14px 0;padding:12px 14px;border-radius:12px;background:var(--late-soft);color:var(--late);font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;width:calc(100% - 28px);text-align:left}

/* Sheet */
.sheet-root{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(8,16,12,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h2{margin:0 44px 4px 0;font:600 26px/1.1 var(--f-cond);overflow-wrap:anywhere}
.sheet .lead{margin:0 0 14px;color:var(--muted)}
.sheet-close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:22px;font-size:28px;line-height:1;display:grid;place-items:center;color:var(--muted)}
.acts{display:grid;gap:10px}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;font-size:17px;text-align:left}
.act small{font-weight:500;color:var(--muted);font-size:15px}
.act.go{background:var(--oxy);border-color:var(--oxy);color:var(--oxy-ink)}
.act.go small{color:inherit;opacity:.85}
.act.rv{border-color:var(--later);color:var(--later)}
.field{display:block;margin:0 0 12px}
.field > span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);padding:8px 12px;font-size:17px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{height:36px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);font:600 17px/1 var(--f-cond)}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}
.warnbox{border-radius:10px;padding:10px 12px;background:var(--later-soft);color:var(--later);font-size:15px;margin:0 0 12px}
.okbox{border-radius:10px;padding:10px 12px;background:var(--oxy-soft);color:var(--oxy);font-size:15px;margin:0 0 12px;font-weight:600}
.errbox{border-radius:10px;padding:10px 12px;background:var(--late-soft);color:var(--late);font-size:15px;margin:0 0 12px;font-weight:600}
.checkline{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:15px}
.checkline input{width:22px;height:22px;margin-top:1px;flex:none}
.res{border-top:1px solid var(--line);margin-top:8px}
.res-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res-row .btn{min-height:42px;padding:0 14px}
table.carico{width:100%;border-collapse:collapse;margin:6px 0 14px}
table.carico td{padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px}
table.carico td:last-child{text-align:right;font:700 24px/1 var(--f-cond)}
table.carico tr.tot td{border-bottom:0;font-weight:700}
.map-prev{overflow-x:auto;margin:8px 0 14px}
.map-prev table{border-collapse:collapse;font-size:13px}
.map-prev td,.map-prev th{border:1px solid var(--line);padding:4px 6px;white-space:nowrap;text-align:left}

.toast{position:fixed;left:12px;right:12px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast span{flex:1;font-size:15px}
.toast button{font-weight:700;color:var(--oxy-soft);padding:8px 6px;white-space:nowrap}
:root[data-theme="dark"] .toast button{color:var(--oxy)}
.storage-warn{margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:var(--late-soft);color:var(--late);font-size:14px;font-weight:600}
.sr-date{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.prose{padding:4px 16px 10px;font-size:15px;line-height:1.5;max-width:68ch}
.prose h3{font:600 20px/1.2 var(--f-cond);margin:14px 0 4px}
.prose p{margin:0 0 8px}


.row{grid-template-columns:50px minmax(0,1fr) auto auto;gap:6px}
@media (min-width:560px){
  .row{grid-template-columns:50px minmax(0,1fr) auto minmax(0,1fr) auto}
  .row > .loc{grid-column:3;max-width:220px;font-size:22px}
  .row > .loc.long{font-size:22px}
  .row > .cnt,.row > .badges{grid-column:5}
}
.row .loc{text-align:center;font:700 20px/1.05 var(--f-cond);text-transform:uppercase;letter-spacing:.01em;color:var(--ink);max-width:132px;overflow-wrap:normal;word-break:normal;padding:0 2px}
.row .loc.long{font-size:18px}
@media (min-width:560px){.row .loc,.row .loc.long{max-width:220px;font-size:22px}}
.row.late .loc{color:var(--late)}
.row.done .loc{color:var(--muted)}
.brand{display:flex;justify-content:center;margin:0 0 4px}
.brand img{height:40px;width:auto;background:#fff;border-radius:11px;padding:6px 16px;box-sizing:content-box;display:block;max-width:48vw;object-fit:contain}
.credit{text-align:center;font-size:13px;color:var(--muted);padding:26px 16px 8px}
.splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash img{width:min(78vw,380px);height:auto}
.splash .bar{width:min(64vw,300px);height:8px;border-radius:4px;background:#E3EDF5;overflow:hidden}
.splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0A7CC1,#29A8E0);border-radius:4px;animation:carica 5s cubic-bezier(.35,.1,.25,1) forwards}
.splash .bar i.fine{animation:none;width:100% !important;transition:width .35s ease-out}
@keyframes carica{0%{width:0}35%{width:40%}55%{width:55%}80%{width:78%}100%{width:90%}}
.splash .lbl.upd{color:#0A7CC1;font-weight:700}
.credit .ver{display:block;margin-top:3px;font-size:12px;opacity:.85}
.splash .lbl{font:500 15px var(--f-body);color:#526477;min-height:20px}
.splash .credit{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));color:#7A8C9D}
.login{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px))}
.login-in{width:100%;max-width:400px;margin:auto 0}
.login-in img{display:block;height:54px;margin:0 auto 22px;background:#fff;border-radius:12px;padding:8px 14px;box-sizing:content-box}
.login-in h1{text-align:center;font:600 34px var(--f-cond);color:var(--oxy)}
.login-in h2{margin:0 0 16px;font:600 30px/1 var(--f-cond);text-align:center}
.login-in .credit{padding-top:34px}
.badges{display:flex;align-items:center;gap:5px}
.bwrap{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;display:block;cursor:pointer}
.bwrap:active{opacity:.55;transform:scale(.94)}
.giro-nota{max-width:46vw;min-height:44px;padding:6px 10px;border:2px solid #b45309;border-radius:10px;background:#fff7ed;color:#9a3412;font:700 16px/1.15 var(--f-cond);text-transform:uppercase;text-align:center;white-space:normal;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .giro-nota{background:#3b2410;color:#fdba74;border-color:#c2410c}}
:root[data-theme="dark"] .giro-nota{background:#3b2410;color:#fdba74;border-color:#c2410c}
.fgb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;padding:3px 5px 4px;border:2px solid var(--muted);border-top-width:5px;border-radius:11px 11px 6px 6px;background:var(--surface);line-height:1;color:var(--ink)}
.fgb small{font:700 9.5px/1 var(--f-body);color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.fgb b{font:700 19px/1 var(--f-cond)}
.row.done .fgb{opacity:.55}
.cnt.gas{border-color:#C2410C;color:#C2410C}
:root[data-theme="dark"] .cnt.gas{border-color:#FB923C;color:#FB923C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cnt.gas{border-color:#FB923C;color:#FB923C}}
.badge.or{background:#E07A00}
.gasrow{display:flex;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface2)}
.stepper b{font:700 18px var(--f-cond);color:#C2410C;margin-right:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:700 22px/1 var(--f-body)}
.stepper output{min-width:24px;text-align:center;font:700 20px var(--f-cond)}
.gasm{color:#C2410C;font-weight:700}
:root[data-theme="dark"] .gasm{color:#FB923C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gasm{color:#FB923C}}
.row .row-main{min-width:88px}
@media (max-width:559px){.row{gap:4px;padding-right:8px}.row .loc{max-width:104px;font-size:18px}.row .loc.long{font-size:15.5px}.badges{flex-direction:column;align-items:stretch;gap:3px}.fgb{flex-direction:row;gap:3px;padding:1px 6px 2px;border-width:1.5px;border-top-width:1.5px;border-radius:7px;min-width:0}.fgb small{margin:0;font-size:9px}.fgb b{font-size:15px}}
.vista-banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#E07A00;color:#fff;padding:8px 12px;font-size:15px}
.vista-banner button{background:#fff;color:#B45F00;font-weight:700;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
body.altrui .top{top:calc(env(safe-area-inset-top,0px) + 44px)}
.vett-bar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;z-index:2;max-width:27vw;display:flex;flex-wrap:wrap;column-gap:4px;align-items:baseline;color:#fff;font-size:13px;line-height:1.2}
.vett-bar span{opacity:.85}
.vett-bar b{font:700 16px/1.15 var(--f-cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.corr-bar{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:2}
.corr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;max-width:44vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.corr-btn svg{width:16px;height:16px;flex:none}
.wd-in{display:flex;align-items:center;justify-content:center;gap:4px}
.wd-dt{display:block}
.wd .wx{display:flex;flex-direction:column;align-items:center;line-height:1}
.wd .wx i{font-style:normal;font-size:15px}
.wd .wx b{font:600 11px/1.2 var(--f-body);opacity:.95}
@media (max-width:399px){.wd-in{gap:2px}.wd .wx i{font-size:13px}.wd .wx b{font-size:10px}.wd .d1{font-size:11px}}
#print-area{display:none}
@media print{
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important}
  body{background:#fff;color:#000}
  :root{padding:0}
}
</style>

function toUTC(iso){const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)}

  const s=String(v ?? '').trim(); if(!s) return '';

  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);

  { const T=todayISO(); for(const p of st.pazienti){ if(p.extra){ p.extra=p.extra.filter(d=>d>=T); if(!p.extra.length) delete p.extra; } } }
  if(!st.patch.includes('note1')){
    for(const p of st.pazienti){
      let n=String(p.note||'');
      n=n.replace(/\s*-?\s*ANTICIPO(\s*\((CICLO\s+)?ERA [^)]*\))?/g,'').replace(/^RECUPERO( - DOVEVA [\d\/]+)?$/,'').replace(/^SPOSTATA DAL .*$/,'').replace(/^[\s-]+|[\s-]+$/g,'');
      p.note=n;
    }
    st.patch.push('note1');
  }
  const match=(p,[n,l,d])=>normTxt(p.nome)===normTxt(n)&&normTxt(p.localita)===normTxt(l)&&p.prossima===d&&!p.spostata;
  let fatte=0;
  for(const pt of PATCHES){
    if(st.patch.includes(pt.id)) continue;
    for(const op of pt.ops){
      if(op.del){const i=st.pazienti.findIndex(p=>match(p,op.del)); if(i>=0){st.pazienti.splice(i,1);fatte++}}
      if(op.set){const p=st.pazienti.find(p=>match(p,op.set)); if(p){Object.assign(p,op.v);fatte++}}
      if(op.fatto){const p=st.pazienti.find(p=>match(p,op.fatto)); if(p&&p.fg){
        let last=p.prossima; while(addDays(last,p.fg)<=pt.rif) last=addDays(last,p.fg);
        const prima=snap(p), next=addDays(last,p.fg);
        p.ultima=last; p.prossima=next;
        st.storico.unshift({id:uid(),ts:Date.now(),tipo:'consegna',pid:p.id,nome:p.nome,localita:p.localita,cnt:p.cnt,note:p.note,fg:p.fg,data:last,prossima:next,prima,recupero:true});
        fatte++}}
    }
    st.patch.push(pt.id);
  }
  return fatte;
}

const CFG = (typeof window!=='undefined' && window.MEDICAIR_CONFIG) || {};

let sb=null, utente=null, vista=null, statoSync='locale', ultimaSync=0, invioT=null, inInvio=false, invioAncora=false, serveLogin=false;
const UKEY='medicair.ultimoUtente';

function segnaErrore(e){

  else if(/JWT|401|403|permission|row-level|policy/i.test(m)) statoSync='permessi';

function hashStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+':'+str.length}
function statoPerCloud(X){X=X||S;const o={};for(const [k,v] of Object.entries(X)){if(k==='storico'||k.startsWith('_'))continue;o[k]=v}return o}
function mesiStorico(list){const m=new Map();for(const h of list){const k=String(h.data||'').slice(0,7)||'senza-data';if(!m.has(k))m.set(k,[]);m.get(k).push(h)}return m}
function clientCloud(){

function usaUtente(u){

async function controllaResponsabile(){

async function initCloud(){

  const c=clientCloud();
  let sess=null;
  let nuovoAvvio=true; try{ nuovoAvvio=sessionStorage.getItem(RKEY_SESS)!=='1'; }catch(e){}
  if(lsGet(RKEY)==='0' && nuovoAvvio){
    try{ if(c) await conTimeout(c.auth.signOut({scope:'local'}),4000); }catch(e){}

  if(sess && sess.user){ usaUtente(sess.user); await Promise.all([scarica(),controllaResponsabile()]); return; }

  let ult=null; try{ult=JSON.parse(lsGet(UKEY)||'null')}catch(e){}

async function scarica(){
  const c=clientCloud(); if(!c||!utente) return;
  const chi=vista||utente;
  try{
    const r=await conTimeout(c.from('stato').select('dati,aggiornato').eq('user_id',chi.id).maybeSingle(),10000);
    if(!r) throw new Error('timeout');
    if(r.error) throw r.error;
    if(!r.data && chi.id!==utente.id){ statoSync='ok'; return; }
    if(!r.data){
      // account nuovo: porto sul cloud i dati già presenti su questo telefono
      if(!S.pazienti.length){ proponiRecupero=true; statoSync='ok'; return; }
      S._rev=Date.now(); S._dirty=true; scriviLocale(); await invia(); return;
    }
    const tCloud=Date.parse(r.data.aggiornato);
    const cloudVuoto=!(r.data.dati&&Array.isArray(r.data.dati.pazienti)&&r.data.dati.pazienti.length);
    if(cloudVuoto && S.pazienti.length){ S._rev=Date.now(); S._dirty=true; scriviLocale(); await invia(); statoSync=statoSync==='attesa'?'ok':statoSync; return; }
    if(cloudVuoto && !S.pazienti.length) proponiRecupero=true;
    if(!S._synced || tCloud>S._synced){
      const m=await conTimeout(c.from('storico_mesi').select('mese,voci').eq('user_id',chi.id),15000);
      if(!m || m.error) throw (m&&m.error)||new Error('timeout');
      let storico=[].concat(...m.data.map(x=>x.voci||[]));
      let unito=false;
      if(S._dirty && S._synced){
        const ids=new Set(storico.map(h=>h.id));
        for(const h of S.storico||[]) if(!ids.has(h.id)){storico.push(h);unito=true}
      }
      storico.sort((a,b)=>(b.ts||0)-(a.ts||0));
      const hashes={}; for(const [k,v] of mesiStorico(m.data.flatMap(x=>x.voci||[]))) hashes[k]=hashStr(JSON.stringify(v));
      S={...r.data.dati, storico, _synced:tCloud, _rev:tCloud, _dirty:unito, _hashMesi:hashes};
      S.storico=S.storico||[]; S.dismissed=S.dismissed||[]; S.mappe=S.mappe||{}; S.pazienti=S.pazienti||[];
      applicaCorrezioni(S);
      scriviLocale();
      if(unito){ setTimeout(()=>toast('Dati aggiornati da un altro dispositivo.'),6500); await invia(); }
    } else if(S._dirty) await invia();
    statoSync='ok'; ultimaSync=Date.now();
  }catch(e){ segnaErrore(e); }
}
function programmaInvio(){ clearTimeout(invioT); statoSync='attesa'; invioT=setTimeout(invia,1500); }
async function invia(){
  const c=clientCloud(); if(!c||!utente) return;
  if(inInvio){invioAncora=true;return}
  inInvio=true;
  const chi=vista||utente, S0=S, K0=KEY;
  const rev=S0._rev||Date.now(), t=new Date(rev).toISOString();
  try{
    const riga=()=>senzaEmail?{user_id:chi.id,dati:statoPerCloud(S0),aggiornato:t}:{user_id:chi.id,email:chi.email||null,dati:statoPerCloud(S0),aggiornato:t};
    let r=await conTimeout(c.from('stato').upsert(riga()),15000);
    if(!r) throw new Error('timeout');
    if(r.error && /'email' column|column .*email/i.test(String(r.error.message||''))){
      // il database non ha ancora la colonna email: salvo lo stesso
      senzaEmail=true;
      r=await conTimeout(c.from('stato').upsert(riga()),15000);
      if(!r) throw new Error('timeout');
    }
    if(r.error) throw r.error;
    const hashes={}, righe=[];
    for(const [k,v] of mesiStorico(S0.storico)){const h=hashStr(JSON.stringify(v));hashes[k]=h;if(!S0._hashMesi||S0._hashMesi[k]!==h) righe.push({user_id:chi.id,mese:k,voci:v,aggiornato:t})}
    for(const k in (S0._hashMesi||{})) if(!(k in hashes)) righe.push({user_id:chi.id,mese:k,voci:[],aggiornato:t});
    if(righe.length){ r=await conTimeout(c.from('storico_mesi').upsert(righe),20000); if(!r) throw new Error('timeout'); if(r.error) throw r.error; }
    S0._hashMesi=hashes; S0._synced=Date.parse(t);
    if(S0._rev===rev) S0._dirty=false;
    try{ localStorage.setItem(K0, JSON.stringify(S0)); }catch(e){}
    statoSync=S._dirty?'attesa':'ok'; ultimaSync=Date.now();
  }catch(e){ segnaErrore(e); }
  finally{
    inInvio=false;
    if(invioAncora||S._dirty&&statoSync==='attesa'){invioAncora=false;programmaInvio()}
    aggiornaSyncUI();
  }
}

async function chiamaAdmin(body){
  const c=clientCloud(); if(!c) throw new Error('Non riesco a collegarmi al server.');
  const r=await conTimeout(c.functions.invoke('admin-corrieri',{body}),20000);
  if(!r) throw new Error('Il server non risponde.');
  if(r.error){
    let m=r.error.message||'Errore';
    let st=0; try{ st=r.error.context&&r.error.context.status||0; const j=await r.error.context.json(); if(j) m=j.error||j.message||j.msg||m; }catch(e){}
    if(st===401&&/jwt/i.test(m)) m='Supabase blocca la chiamata (Invalid JWT): disattiva "Verify JWT" nelle impostazioni della funzione admin-corrieri.';
    if(st===404||/Failed to send|Requested function was not found|FunctionsFetchError|FunctionsRelayError/i.test(m)) m='NOFN';
    throw new Error(m);
  }
  let d=r.data;
  if(typeof d==='string'){ try{ d=JSON.parse(d) }catch(e){} }
  if(d&&d.error) throw new Error(d.error);
  const giusta = body.azione==='lista' ? (d&&Array.isArray(d.utenti)) : (d&&d.ok===true);
  if(!giusta) throw new Error('CODICE');
  return d;
}

/* ---------- regole del ciclo ---------- */
function calcNext(p,d){
  const fg=p.fg; if(!fg) return '';
  const a=p.prossima;
  if(!a) return addDays(d,fg);
  if(d<a){
    const fisso=GIORNI.indexOf(p.giorno);
    if(fisso<0 || wd(d)===fisso) return addDays(d,fg);   // anticipo: riparte dalla consegna
    return addDays(a,fg);                                  // eccezione in altro giorno: ciclo invariato
  }
  let n=addDays(a,fg);                                     // in ritardo o nel giorno giusto: cadenza originale
  while(n<=d) n=addDays(n,fg);
  return n;
}
function rinvioDate(p,D,n){
  const e=eff(p);
  const base = (e && e>D) ? e : D;
  let r=addDays(base,n);
  if(wd(r)===0) r=addDays(r,1);
  return r;
}
function dataOperazione(D){const T=todayISO();return D<T?D:T}
function snap(p){return {ultima:p.ultima, prossima:p.prossima, spostata:p.spostata?{...p.spostata}:null, vacanza:p.vacanza?{...p.vacanza}:null, reso:p.reso?{...p.reso}:null, extra:p.extra?[...p.extra]:null}}
function logOp(h){S.storico.unshift(Object.assign({id:uid(), ts:Date.now()},h))}

function consegna(id){
  const p=byId(id); if(!p) return;
  const d=dataOperazione(ui.day);
  const prima=snap(p);
  if(p.vacanza){p.prossima='';}
  const next=calcNext(p,d);
  p.ultima=d; p.prossima=next; p.spostata=null; p.vacanza=null;
  logOp({tipo:'consegna', pid:p.id, nome:p.nome, localita:p.localita, cnt:p.cnt, gas:p.gas||null, note:p.note, fg:p.fg, data:d, giro:ui.day, prossima:next, prima});
  save(); closeSheet(); render();
  const hid=S.storico[0].id;
  toast(next ? `${p.nome}: consegnato. Prossima ${fmtShort(next)}.` : `${p.nome}: consegnato. Manca la F.G.: imposta la prossima visita nella scheda.`, ()=>annulla(hid));
}
function rimanda(id,n,dataFissa){

function isExtra(p,D){return !!(p.extra && p.extra.includes(D))}
function aggiungiExtra(ids,D,etichetta){
  const T=todayISO(); let n=0, ultimo=null;
  for(const id of ids){

    const e=eff(p);

    const prima=snap(p);
    p.extra=[...(p.extra||[]),D].sort();
    logOp({tipo:'extra', pid:p.id, nome:p.nome, localita:p.localita, cnt:p.cnt, data:T, a:D, prima});
    ultimo=S.storico[0].id; n++;
  }
  save(); closeSheet(); if(ui.day!==D) ui.day=D; ui.tab='giro'; render();
  if(!n){toast('Sono già tutti nel giro di '+fmtShort(D)+'.');return}
  if(n===1){const hid=ultimo;toast(`${S.storico[0].nome} aggiunto come extra a ${fmtShort(D)}. Il suo giro normale non cambia.`,()=>annulla(hid))}
  else toast(`${n} pazienti${etichetta?' del gruppo '+etichetta:''} aggiunti come extra a ${fmtShort(D)}. I loro giri normali non cambiano.`);
}

function canUndo(h){

function annulla(hid){

  p.ultima=h.prima.ultima; p.prossima=h.prima.prossima; p.spostata=h.prima.spostata; p.vacanza=h.prima.vacanza||null; p.reso=h.prima.reso||null; if(h.prima.extra!==undefined){ if(h.prima.extra&&h.prima.extra.length) p.extra=[...h.prima.extra]; else delete p.extra; }
  S.storico=S.storico.filter(x=>x!==h);
  save(); closeSheet(); render();

/* ---------- calcolo del giro ---------- */
function giroDi(D){
  const T=todayISO();
  const arretrati=[], delGiorno=[], senzaData=[], extra=[], resi=[];
  for(const p of S.pazienti){
    if(p.reso){ const r=p.reso; if(!r.ritirato && r.ritiro && (r.ritiro===D || (r.ritiro<T && D>=T))) resi.push(p); continue; }
    const e=eff(p);
    if(!e){ if(D===T && !p.vacanza) senzaData.push(p); continue; }
    if(e===D) delGiorno.push(p);
    else if(e<T && D>=T) arretrati.push(p);
    else if(isExtra(p,D)) extra.push(p);
  }
  arretrati.sort((a,b)=>eff(a).localeCompare(eff(b))||a.nome.localeCompare(b.nome));
  const fatti=S.storico.filter(h=>(h.tipo==='consegna'||h.tipo==='ritirato') && (h.giro||h.data)===D);
  resi.sort((a,b)=>a.reso.ritiro.localeCompare(b.reso.ritiro)||a.nome.localeCompare(b.nome));
  return {arretrati, delGiorno, senzaData, fatti, extra, resi};
}
function contaGiorno(d, idx){
  const T=todayISO();
  let n=idx.get(d)||0, late=0;
  if(d===T){ for(const [k,v] of idx) if(k<T) late+=v; late+=idx.get('')||0; }
  for(const p of S.pazienti){ if(p.reso){ const r=p.reso; if(!r.ritirato&&r.ritiro&&(r.ritiro===d||(r.ritiro<T&&d===T))) n++; continue; } if(isExtra(p,d) && eff(p)!==d && !(eff(p)&&eff(p)<T&&d>=T)) n++; }
  return {n:n+late, late};
}
function indiceDate(){const m=new Map();for(const p of S.pazienti){if(p.reso) continue;const e=eff(p);if(!e&&p.vacanza) continue;m.set(e,(m.get(e)||0)+1)}return m}
function rimandatiDa(D){
  const seen=new Set(), out=[];
  for(const h of S.storico){ if(h.tipo!=='rinvio' || (h.da||h.data)!==D || seen.has(h.pid)) continue; seen.add(h.pid); out.push(h); }
  return out.sort((a,b)=>a.a.localeCompare(b.a)||a.nome.localeCompare(b.nome));
}
function rimandatiA(D){return S.pazienti.filter(p=>p.spostata&&p.spostata.motivo==='rinvio'&&p.spostata.data===D).sort((a,b)=>a.nome.localeCompare(b.nome))}
function listaRimandati(){return S.pazienti.filter(p=>p.spostata&&p.spostata.motivo==='rinvio').sort((a,b)=>a.spostata.data.localeCompare(b.spostata.data)||a.nome.localeCompare(b.nome))}

function parseCnt(cnt,note){
  const r={bombole:{}, gassosi:{}, variabile:false, reso:false, vuoto:false, gasNote:false};
  const n=String(note||'').toUpperCase();
  if(/\bRESO\b/.test(n)) r.reso=true;
  const c=cleanCnt(cnt);
  if(!c) r.vuoto=true;
  else if(c.startsWith('VAR')) r.variabile=true;
  else for(const part of c.split('+')){
    const m=part.match(/^(?:(\d+)X)?(\d+T?)$/); if(!m) continue;
    const q=+(m[1]||1), t=m[2];
    const bag=(t==='6000'||t==='3000')?r.gassosi:r.bombole;
    bag[t]=(bag[t]||0)+q;
  }
  let foundGas=false;
  for(const m of n.matchAll(/(\d+)\s*X\s*(6000|3000)/g)){r.gassosi[m[2]]=(r.gassosi[m[2]]||0)+(+m[1]);foundGas=true}
  if(/GASSOS/.test(n) && !foundGas) r.gasNote=true;
  return r;
}
function riepilogo(items){
  const tot={}, gas={}, resi=[], variabili=[], vuoti=[], gasNote=[];
  let totale=0;
  for(const it of items){
    const r=parseCnt(it.cnt,it.note);
    if(r.reso){resi.push(it);continue}
    if(r.variabile) variabili.push(it);
    if(r.vuoto) vuoti.push(it);
    if(r.gasNote) gasNote.push(it);
    for(const [t,q] of Object.entries(r.bombole)){tot[t]=(tot[t]||0)+q;totale+=q}
    for(const [t,q] of Object.entries(r.gassosi)) gas[t]=(gas[t]||0)+q;
    if(it.gas) for(const [t,q] of Object.entries(it.gas)) gas[t]=(gas[t]||0)+q;
  }
  const tipi=Object.keys(tot).sort((a,b)=>{const ia=ORDINE_CNT.indexOf(a),ib=ORDINE_CNT.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  return {tot, tipi, totale, gas, resi, variabili, vuoti, gasNote};
}

/* ---------- verifiche ---------- */
function verifiche(){
  const out=[], P=S.pazienti, dis=new Set(S.dismissed);
  for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
    const a=P[i], b=P[j];
    if(isPossibleDup(a,b)){const k=pairKey(a,b); if(!dis.has(k)) out.push({tipo:'doppio',a,b,k})}
  }
  for(const p of P){
    if(p.vacanza||p.reso) continue;
    if(!eff(p)) out.push({tipo:'data',p});
    if(!p.fg) out.push({tipo:'fg',p});
    if(!p.cnt) out.push({tipo:'cnt',p});
    if(!p.giorno) out.push({tipo:'giorno',p});
    else if(p.prossima && !p.spostata && GIORNI[wd(p.prossima)]!==p.giorno && !dis.has('gg|'+p.id+'|'+p.prossima+'|'+p.giorno)) out.push({tipo:'gdiv',p});
  }
  return out;
}

function storageWarn(){const w=(CLOUD&&utente&&(statoSync==='nodb'||statoSync==='permessi'))?`<div class="storage-warn">${esc(testoSync())}.${erroreSync?` Dettaglio: ${esc(erroreSync.slice(0,120))}`:''}</div>`:'';return w+(storageOK?'':'<div class="storage-warn">Il telefono non sta salvando i dati di questa pagina. Scarica un backup da Altro prima di chiudere.</div>')}

function rowHTML(p,kind){
  const D=ui.day, e=eff(p), T=todayISO();
  const meta=[];
  if(kind==='late'){
    const ref = D>=T?T:D;
    const g=diffDays(ref,e);
    meta.push(`<span class="lt">Arretrato dal ${fmtShort(e)}${g>0?`, ${g} ${g===1?'giorno':'giorni'}`:''}</span>`);
  } else if(kind==='nodate'){
    meta.push('<span class="lt">Senza data di visita: apri la scheda</span>');
  } else if(kind==='pastpend'){
    meta.push('<span class="lt">Non consegnato</span>');
  } else if(kind==='reso'){
    const r=p.reso, T=todayISO();
    meta.push(`<span class="tag rs">Reso</span>${r.ritiro<T?`<span class="lt">ritiro previsto ${fmtShort(r.ritiro)}</span>`:'da ritirare'}`);
    if(r.nota) meta.push(esc(r.nota));
  } else if(kind==='extra'){
    meta.push(`<span class="tag vc">Extra</span>il suo giro resta ${e?fmtShort(e):'senza data'}`);
  }
  if(p.spostata && p.spostata.motivo==='rinvio') meta.push(`<span class="rv">Rimandato (ciclo ${fmtShort(p.prossima)})</span>`);
  if(p.spostata && p.spostata.motivo==='aggiunto') meta.push('<span class="rv">Aggiunto al giro</span>');
  if(p.vacanza) meta.push('<span class="rv">Rientro dalle vacanze</span>');
  if(kind!=='reso' && p.gas) meta.push(`<span class="gasm">Gassosi ${esc(gasTesto(p.gas))}</span>`);
  if(kind!=='reso') meta.push('Ultima '+(p.ultima?fmtShort(p.ultima):'—'));
  return `<div class="row${kind==='late'||kind==='nodate'||kind==='pastpend'?' late':''}">
    <button class="check" data-act="${kind==='extra'?'consegna-extra':kind==='reso'?'ritirato':'consegna'}" data-id="${p.id}" aria-label="${kind==='reso'?'Segna ritirato':'Segna consegnato'} ${esc(p.nome)}">${ICON_CHECK}</button>
    <button class="row-main" data-act="${kind==='extra'?'azioni-extra':kind==='reso'?'azioni-reso':'azioni'}" data-id="${p.id}">
      <span class="nome">${esc(p.nome)}</span>
      <span class="meta">${meta.join('. ')}</span>
      ${p.note?`<span class="note">${esc(p.note)}</span>`:''}
    </button>
    <span class="loc${String(p.localita).length>11?' long':''}">${esc(titolo(p.localita))}</span>
    <span class="badges">${kind==='reso'?cntBadge(p.reso.cnt):notaGiroDi(p,D)?`<button class="bwrap giro-nota" data-act="edit-nota-giro" data-id="${p.id}" aria-label="Modifica nota">${esc(notaGiroDi(p,D))}</button>`:`<button class="bwrap" data-act="edit-fg" data-id="${p.id}" aria-label="Modifica F.G. ${esc(p.nome)}">${fgBadge(p.fg)}</button><button class="bwrap" data-act="edit-cnt" data-id="${p.id}" aria-label="Modifica CNT ${esc(p.nome)}">${cntBadge(p.cnt)}</button>`}</span>
  </div>`;
}
function doneRowHTML(h){
  const undo=canUndo(h);
  return `<div class="row done">
    <span class="check" aria-hidden="true">${ICON_CHECK}</span>
    <div class="row-main">
      <span class="nome">${esc(h.nome)}</span>
      <span class="meta">${h.tipo==='ritirato'?`<span class="tag rs">Reso ritirato</span>`:`${h.extra?'<span class="tag vc">Extra</span>':''}${h.extra?'Giro normale':'Prossima'} ${fmtShort(h.prossima)}`}</span>
      ${undo?`<button class="undo-btn" data-act="annulla" data-hid="${h.id}">${h.tipo==='ritirato'?'Annulla ritiro':'Annulla consegna'}</button>`:''}
    </div>
    <span class="loc${String(h.localita).length>11?' long':''}">${esc(titolo(h.localita))}</span>
    <span class="badges">${h.tipo==='ritirato'?'':fgBadge(h.fg)}${cntBadge(h.cnt)}</span>
  </div>`;
}
function gruppiLocalita(list){
  const m=new Map();
  for(const p of list){const k=normTxt(p.localita)||'—';if(!m.has(k)) m.set(k,{nome:p.localita||'Senza località',items:[]});m.get(k).items.push(p)}
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([,g])=>{g.items.sort((a,b)=>a.nome.localeCompare(b.nome));return g});
}
function titolo(s){return String(s||'').toLowerCase().replace(/(^|[\s\/'(.\-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())}
function renderGiro(){
  const D=ui.day, T=todayISO();
  const g=giroDi(D);
  const idx=indiceDate();
  const pend=[...g.senzaData,...g.arretrati,...g.delGiorno,...g.extra,...g.resi];
  const rim=rimandatiDa(D);
  const car=riepilogo([...g.senzaData,...g.arretrati,...g.delGiorno,...g.extra,...g.fatti.filter(h=>h.tipo==='consegna')]);
  const bombDaFare=riepilogo([...g.senzaData,...g.arretrati,...g.delGiorno,...g.extra]).totale;
  const bombFatte=riepilogo(g.fatti.filter(h=>h.tipo==='consegna')).totale;
  const mon=addDays(D,-((wd(D)+6)%7));
  const days=[];
  for(let i=0;i<6;i++){const d=addDays(mon,i);const c=contaGiorno(d,idx);if(i===5 && !c.n && d!==D) continue;days.push({d,...c})}
  let h=`<header class="top">
    ${LOGO.startsWith('data:')?`<div class="brand"><img src="${LOGO}" alt="MedicAir People"></div>`:''}
    ${CLOUD&&utente?`<div class="vett-bar"><span>Vettore:</span><b>${esc(nomeVettore())}</b></div>`:''}
    ${CLOUD&&utente&&utente.admin?`<div class="corr-bar"><button class="corr-btn" data-act="corrieri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11a4 4 0 100-8 4 4 0 000 8zM2 21v-1a6 6 0 0112 0v1M16 3.5a4 4 0 010 7.5M22 21v-1a6 6 0 00-4-5.6"/></svg>${inVistaAltrui()?esc(nomeVettore()):'Corrieri'}</button></div>`:''}
    <div class="top-row">
      <button class="icon-btn" data-act="giorno" data-n="-7" aria-label="Settimana precedente">‹</button>
      <div class="top-date">
        <button class="pick" data-act="scegli-giorno" aria-label="Scegli una data"><h1>${fmtLong(D)}</h1></button>
        ${D!==T?'<div><button class="back-today" data-act="oggi">Torna a oggi</button></div>':''}
      </div>
      <button class="icon-btn" data-act="giorno" data-n="7" aria-label="Settimana successiva">›</button>
    </div>
    <div class="week">${days.map(x=>`<button class="wd${x.d===D?' sel':''}${x.d===T?' today':''}${x.late?' has-late':''}" data-act="vai" data-d="${x.d}" aria-label="${fmtLong(x.d)}${meteo[x.d]?', '+descMeteo(meteo[x.d].c)+', massima '+meteo[x.d].max+' gradi':''}"><span class="wd-in"><span class="wd-dt"><span class="d1">${GB[wd(x.d)]}</span><span class="d2">${dm(x.d).d}</span></span>${meteo[x.d]?`<span class="wx"><i>${iconaMeteo(meteo[x.d].c)}</i><b>${meteo[x.d].max}°</b></span>`:''}</span></button>`).join('')}</div>
  </header>`;
  h+=`<div class="stats">
    <div class="stat"><b>${bombDaFare}</b><span>da fare</span></div>
    <div class="stat"><b>${bombFatte}</b><span>consegnati</span></div>
    <button class="stat stat-btn${rim.length?' warn':''}" data-act="rimandati"><b>${rim.length}</b><span>rimandati</span></button>
    <button class="stat stat-btn" data-act="carico"><b>${car.totale}</b><span>bombole</span></button>
  </div>`;
  h+=storageWarn();
  if(g.senzaData.length){
    h+=`<div class="sec late"><h2>Senza data</h2><span class="c">${g.senzaData.length}</span></div><div class="sec-note">Questi pazienti non hanno una prossima visita: aprili e impostala, oppure consegna.</div><div class="list">${g.senzaData.map(p=>rowHTML(p,'nodate')).join('')}</div>`;
  }
  if(g.resi.length){
    h+=`<div class="sec"><h2>Resi da ritirare</h2><span class="c">${g.resi.length}</span></div><div class="sec-note">Bombole da riprendere: non sono contate nel carico.</div><div class="list">${g.resi.map(p=>rowHTML(p,'reso')).join('')}</div>`;
  }
  if(g.arretrati.length){
    h+=`<div class="sec late"><h2>Arretrati</h2><span class="c">${g.arretrati.length}</span></div><div class="sec-note"><button class="btn" data-act="gia-fatti">Segna quelli già fatti</button></div><div class="list">${g.arretrati.map(p=>rowHTML(p,'late')).join('')}</div>`;
  }
  const past = D<T;
  const giro=[...g.delGiorno,...g.extra].sort((a,b)=>normTxt(a.localita).localeCompare(normTxt(b.localita))||a.nome.localeCompare(b.nome));
  if(giro.length){
    if(g.arretrati.length||g.resi.length||g.senzaData.length) h+=`<div class="sec"><h2>Giro del giorno</h2><span class="c">${giro.length}</span></div>`;

  }
  if(!S.pazienti.length){
    h+=`<div class="card"><h3>Carica i tuoi pazienti</h3><p>L’archivio su questo telefono è vuoto. Se hai un backup scaricato dall’app, ripristinalo. Altrimenti importa il file Pazienti_Database.csv.</p><button class="btn primary" data-act="ripristina">Ripristina backup</button><button class="btn" data-act="importa">Importa CSV o Excel</button></div>`;
  } else if(!pend.length && !g.fatti.length){
    h+=`<div class="empty"><strong>Nessuno in programma</strong>${D<T?'In questo giorno non risultano consegne.':'Per questo giorno non ci sono pazienti in ciclo. Puoi aggiungerne uno con il pulsante in basso.'}</div>`;
  } else if(!pend.length){

  }
  h+=`<div class="foot-actions"><button class="btn" data-act="foglio">Foglio del giorno</button><button class="btn" data-act="carico">Bombole da caricare</button></div>`;
  return h;
}

function renderPazienti(){
  const ver=verifiche();
  const chips=[['tutti','Tutti'],['lunedì','Lun'],['martedì','Mar'],['mercoledì','Mer'],['giovedì','Gio'],['venerdì','Ven']];
  if(S.pazienti.some(p=>p.giorno==='sabato')) chips.push(['sabato','Sab']);
  for(const g of elencoGruppi()) chips.push(['g:'+g.nome,g.nome]);
  let h=`<header class="page-h"><h1>Pazienti</h1><span class="sub">${S.pazienti.length} in archivio</span><button class="btn primary" data-act="nuovo">Nuovo</button></header>${storageWarn()}`;
  h+=`<div class="search"><input id="paz-q" type="search" placeholder="Cerca per nome, località o CNT" value="${esc(ui.q)}" autocomplete="off"></div>`;
  h+=`<div class="chips">${chips.map(([k,l])=>`<button class="chip" data-act="filtro" data-f="${k}" aria-pressed="${ui.filtro===k}">${l}</button>`).join('')}${ver.length?`<button class="chip warn" data-act="filtro" data-f="verifica" aria-pressed="${ui.filtro==='verifica'}">Da verificare ${ver.length}</button>`:''}</div>`;
  h+=`<div id="paz-list">${pazListHTML()}</div>`;
  return h;
}
function pazListHTML(){
  if(ui.filtro==='verifica') return verificaHTML();
  if(!S.pazienti.length) return `<div class="empty"><strong>Archivio vuoto</strong>Importa i pazienti da un file CSV o Excel dalla sezione Altro, oppure creane uno con Nuovo.</div>`;
  const q=normTxt(ui.q);
  let L=S.pazienti.filter(p=>(ui.filtro==='tutti'||p.giorno===ui.filtro||(ui.filtro.startsWith('g:')&&p.gruppo===ui.filtro.slice(2))) && (!q || normTxt(p.nome+' '+p.localita+' '+p.cnt+' '+p.note).includes(q)));
  L.sort((a,b)=>a.nome.localeCompare(b.nome)||a.localita.localeCompare(b.localita));
  if(!L.length) return `<div class="empty"><strong>Nessun risultato</strong>Prova a cercare solo il cognome o la località.</div>`;
  return `<div class="list">${L.map(p=>{
    const e=eff(p), T=todayISO();
    let when = e?`Prossima ${fmtShort(e)}`:'<span class="lt">Senza data</span>';
    if(e && e<T) when=`<span class="lt">Arretrato dal ${fmtShort(e)}</span>`;
    if(p.spostata && p.spostata.motivo==='rinvio') when+=` <span class="rv">(rimandato)</span>`;
    if(p.reso) when=`<span class="tag rs">Reso</span>${p.reso.ritirato?'ritirato '+fmtShort(p.reso.ritirato):'da ritirare'}`;
    else if(inVacanza(p)) when=`<span class="tag vc">In vacanza</span>${p.vacanza.al?`rientro ${fmtShort(p.vacanza.al)}`:'rientro non fissato'}`;
    return `<button class="prow" data-act="scheda" data-id="${p.id}"><span class="row-main"><span class="nome">${esc(p.nome)}</span><span class="meta">${esc(p.localita)}${p.gruppo?`, gruppo ${esc(p.gruppo)}`:''}</span><span class="meta">F.G. ${p.fg||'?'}, ${esc(p.giorno||'giorno non impostato')}. ${when}</span></span>${cntBadge(p.cnt,true)}</button>`;
  }).join('')}</div>`;
}
function miniP(p){return `<strong>${esc(p.nome)}</strong><div class="meta">${esc(p.localita)}, CNT ${esc(p.cnt||'?')}, F.G. ${p.fg||'?'}, ${esc(p.giorno||'—')}</div><div class="meta">Ultima ${fmtShort(p.ultima)}, prossima ${fmtShort(eff(p))}</div>${p.note?`<div class="meta">${esc(p.note)}</div>`:''}`}
function verificaHTML(){

function renderVacanza(){

function sheetVacanza(id){

  ${p&&p.reso?`<div class="warnbox">Nei resi dal ${fmtShort(p.reso.dal)}${p.reso.ritirato?`, ritirato il ${fmtShort(p.reso.ritirato)}`:''}. <button class="undo-btn" data-act="rientro" data-id="${p.id}">Rimetti attivo</button></div>`:''}

function dupWarn(nome,giro){
  const box=$('#dup-warn'); if(!box) return;
  const s=normTxt(nome).split(' ')[0];
  if(!s||s.length<3){box.innerHTML='';return}
  const L=S.pazienti.filter(p=>surname(p)===s).slice(0,5);
  box.innerHTML=L.length?`<div class="warnbox">In archivio c’è già: ${L.map(p=>`<div style="margin-top:6px"><strong>${esc(p.nome)}</strong>, ${esc(p.localita)} ${giro?`<button class="undo-btn" data-act="add-giro" data-id="${p.id}">Metti lui nel giro</button>`:`<button class="undo-btn" data-act="scheda" data-id="${p.id}">Apri</button>`}</div>`).join('')}</div>`:'';
}
function salvaScheda(btn){
  const id=btn.dataset.id, giro=!!btn.dataset.giro;
  const nome=$('#f-nome').value.trim().toUpperCase(), loc=$('#f-loc').value.trim().toUpperCase();
  const cnt=cleanCnt($('#f-cnt').value), fg=toFG($('#f-fg').value), gg=$('#f-gg').value;
  const gas={}; for(const t of TIPI_GAS){const n=+($('#gas-'+t).textContent||0); if(n>0) gas[t]=n;}
  const gasV=Object.keys(gas).length?gas:null;
  const ult=$('#f-ult').value, note=$('#f-note').value.trim(), gruppo=gruppoDa($('#f-gruppo').value,'');
  let pro=$('#f-pro').value;
  const mv=$('#f-move');
  const err=[];
  if(!nome) err.push('il nome'); if(!loc) err.push('la località'); if(!fg) err.push('la F.G.');
  if(err.length){$('#f-err').innerHTML=`<div class="errbox">Manca ${err.join(', ')}.</div>`;return}
  if(mv && mv.checked) pro=mv.dataset.nd;
  if(id){
    const p=byId(id); if(!p) return;
    Object.assign(p,{nome,localita:loc,cnt,fg,giorno:gg,ultima:validISO(ult)?ult:'',prossima:validISO(pro)?pro:'',note,gruppo}); if(gasV) p.gas=gasV; else delete p.gas;
    save(); closeSheet(); render(); toast(`Scheda di ${nome} salvata.`);
  } else {
    const D=ui.day<todayISO()?todayISO():ui.day;
    const p={id:uid(),nome,localita:loc,cnt,fg,giorno:gg||'',ultima:validISO(ult)?ult:'',prossima:validISO(pro)?pro:'',note,gruppo,spostata:null}; if(gasV) p.gas=gasV;
    if(giro){ p.prossima=D; if(!p.giorno) p.giorno=GIORNI[wd(D)]; if(addNota) p.notaGiro={data:D,testo:addNota}; addNota=''; }
    if(!p.giorno && p.prossima) p.giorno=GIORNI[wd(p.prossima)];
    S.pazienti.push(p); save(); closeSheet();
    if(giro){ui.tab='giro';ui.day=D}
    render(); toast(giro?`${nome} creato e messo nel giro di ${fmtShort(D)}.`:`${nome} aggiunto all’archivio.`);
  }
}

function salvaFgRapido(id){

/* ---------- arretrati già fatti ---------- */
function cicloRecupero(p){
  const T=todayISO(), a=p.prossima, fg=p.fg;
  if(!a||!fg||a>T) return null;
  let last=a; while(addDays(last,fg)<=T) last=addDays(last,fg);
  return {data:last, next:addDays(last,fg)};
}

/* ---------- foglio giro ---------- */
function foglio(D){
  const g=giroDi(D);
  const items=[
    ...g.senzaData.map(p=>({p,tag:'SENZA DATA',done:false})),
    ...g.arretrati.map(p=>({p,tag:'ARR. dal '+fmtNum(eff(p)),done:false})),
    ...g.delGiorno.map(p=>({p,tag:'',done:false})),
    ...g.extra.map(p=>({p,tag:'EXTRA',done:false})),
    ...g.resi.map(p=>({p:{nome:p.nome,localita:p.localita,cnt:p.reso.cnt,fg:'',note:'RESO'+(p.reso.nota?' '+p.reso.nota:'')},tag:'RITIRO',done:false})),
    ...g.fatti.map(h=>({p:{nome:h.nome,localita:h.localita,cnt:h.cnt,gas:h.gas,fg:h.tipo==='ritirato'?'':h.fg,note:h.tipo==='ritirato'?'RESO':h.note},tag:h.tipo==='ritirato'?'RITIRO':'',done:true}))
  ].sort((a,b)=>normTxt(a.p.localita).localeCompare(normTxt(b.p.localita))||a.p.nome.localeCompare(b.p.nome));
  const car=riepilogo(items.map(x=>x.p));
  const n=items.length, MAX=34;
  const BUDGET=228;
  const rowH = n>MAX ? Math.max(3.9, BUDGET/n) : 6.7;
  const fs = Math.min(10, rowH*1.4);
  const empties = Math.max(0, Math.floor(BUDGET/rowH) - n);
  let prev=null, rows='';
  for(const it of items){
    const k=normTxt(it.p.localita); const grp=prev!==null && k!==prev; prev=k;
    const note=[it.tag, it.p.gas?'GAS '+gasTesto(it.p.gas,'x'):'', it.p.note].filter(Boolean).join(' – ');
    rows+=`<tr class="${grp?'grp':''}${it.tag?' arr':''}"><td class="v">${it.done?'✓':''}</td><td class="n">${esc(it.p.nome)}</td><td class="c">${esc(it.p.cnt||'?')}</td><td>${esc(it.p.localita)}</td><td class="c">${it.p.fg||''}</td><td>${esc(note)}</td></tr>`;
  }
  for(let i=0;i<empties;i++) rows+=`<tr class="${i===0&&n?'grp':''}"><td class="v"></td><td></td><td></td><td></td><td></td><td></td></tr>`;
  const {y,m,d}=dm(D);
  const extra=[];
  if(Object.keys(car.gas).length) extra.push('Gassosi a parte: '+Object.entries(car.gas).map(([t,q])=>`${q}×${t}`).join(', '));
  if(car.resi.length) extra.push('Resi: '+car.resi.map(x=>x.nome).join(', '));
  if(car.variabili.length) extra.push('Variabile: '+car.variabili.map(x=>x.nome).join(', '));
  const css=`@page{size:A4 portrait;margin:10mm}
  .fg-sheet{font-family:Arial,Helvetica,sans-serif;color:#000;width:190mm}
  .fg-head{display:flex;justify-content:space-between;align-items:baseline;height:10mm;margin-bottom:2mm}
  .fg-head h1{font-size:15pt;margin:0}
  .fg-head span{font-size:10pt}
  .fg-t{width:100%;border-collapse:collapse;table-layout:fixed}
  .fg-t th,.fg-t td{border:0.6pt solid #000;padding:0 1.5mm;height:${rowH}mm;line-height:1;box-sizing:border-box;font-size:${fs}pt;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .fg-t th{background:#e6e6e6;height:7mm;font-size:9pt;text-align:left}
  .fg-t td.v{text-align:center;font-weight:bold}
  .fg-t td.v::before{content:"";display:inline-block;width:3.2mm;height:3.2mm;border:0.9pt solid #000;vertical-align:middle;margin-right:0}
  .fg-t td.v:not(:empty)::before{display:none}
  .fg-t td.n{font-weight:bold}
  .fg-t td.c{text-align:center;font-weight:bold}
  .fg-t tr.grp td{border-top:1.6pt solid #000}
  .fg-t tr.arr td.n{text-decoration:underline}
  .fg-sum{margin-top:3mm;font-size:10pt;line-height:1.35}
  .fg-sum b{font-size:11pt}`;
  const body=`<div class="fg-sheet"><div class="fg-head"><h1>Giro di ${GIORNI[wd(D)]} ${d} ${MESI[m-1]} ${y}</h1><span>${n} pazienti</span></div>
  <table class="fg-t"><colgroup><col style="width:8mm"><col style="width:46mm"><col style="width:20mm"><col style="width:40mm"><col style="width:11mm"><col></colgroup>
  <thead><tr><th>V</th><th>PAZIENTE</th><th>CNT</th><th>LOCALITA'</th><th>F.G.</th><th>NOTE</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="fg-sum"><b>Riepilogo CNT:</b> ${car.tipi.map(t=>`${t} × ${car.tot[t]}`).join('&nbsp;&nbsp;&nbsp;')}&nbsp;&nbsp;&nbsp;<b>Totale ${car.totale} bombole</b>${extra.length?'<br>'+esc(extra.join('. ')):''}</div></div>`;
  return {css, body, doc:`<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Giro ${D}</title><style>body{margin:0}${css}</style></head><body>${body}</body></html>`};
}

let dlP=null;
function getDownloads(){
  if(!dlP) dlP=(window.claude && typeof window.claude.use==='function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
  return dlP;
}
async function saveFile(name,data,mime){
  const dl=await getDownloads();
  if(dl){
    try{ await dl.save({filename:name,data}); return true; }
    catch(e){
      const c=e&&e.code;
      if(c==='declined') return false;
      if(c==='rate_limited'){toast('Attendi un attimo e riprova.');return false}
      if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('Download non riuscito.');return false}
    }
  }
  const blob=new Blob([data],{type:mime});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  return true;
}

function normH(s){return normTxt(s).toLowerCase()}
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length;
  const del=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===del){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res(window.XLSX);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('xlsx'));
    document.head.appendChild(s);
  });
}
function autoMap(headers){
  const H=headers.map(normH), map={}, used=new Set();
  const score=(h,syn)=>{let best=0;for(const s of syn){if(h===s) best=Math.max(best,3);else if(s.length>=4 && h.startsWith(s)) best=Math.max(best,2);else if(s.length>=5 && h.includes(s)) best=Math.max(best,1)}return best};
  const cand=[];
  CAMPI.forEach(([k,,syn])=>H.forEach((h,i)=>{const sc=score(h,syn);if(sc) cand.push({k,i,sc})}));
  cand.sort((a,b)=>b.sc-a.sc);
  for(const c of cand){ if(map[c.k]!==undefined || used.has(c.i)) continue; map[c.k]=c.i; used.add(c.i); }
  return map;
}
let imp=null;
async function leggiImport(file){
  try{
    let rows;
    if(/\.xlsx?$/i.test(file.name)){
      toast('Leggo il file Excel…');
      const X=await loadXLSX();
      const wb=X.read(await file.arrayBuffer(),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).filter(r=>r.some(x=>String(x).trim()!==''));
    } else rows=parseCSV(await file.text());
    if(rows.length<2) throw new Error('vuoto');
    let hi=0, best=-1;
    for(let i=0;i<Math.min(6,rows.length);i++){const n=Object.keys(autoMap(rows[i])).length;if(n>best){best=n;hi=i}}
    const headers=rows[hi].map(x=>String(x).trim());
    const sig=headers.map(normH).join('|');
    const map=(S.mappe&&S.mappe[sig])?{...S.mappe[sig]}:autoMap(headers);
    imp={headers, data:rows.slice(hi+1), map, sig, mode:S.pazienti.length?'aggiorna':'sostituisci'};
    sheetImport();
  }catch(e){toast(e.message==='xlsx'?'Per leggere Excel serve la connessione. In alternativa salva il file come CSV.':'Non riesco a leggere questo file. Prova a salvarlo come CSV.')}
}
function mappedRows(){
  const g=(r,k)=>imp.map[k]===undefined||imp.map[k]===''?'':r[imp.map[k]];
  return imp.data.map(r=>{const o={};CAMPI.forEach(([k])=>o[k]=g(r,k));return o}).filter(o=>String(o.nome).trim());
}

  ${S.pazienti.length?`<label class="checkline"><input type="radio" name="imode" value="aggiorna" ${imp.mode==='aggiorna'?'checked':''}><span>Aggiungi e aggiorna: chi ha lo stesso nome e località viene aggiornato, gli altri aggiunti.</span></label>
  <label class="checkline"><input type="radio" name="imode" value="sostituisci" ${imp.mode==='sostituisci'?'checked':''}><span>Sostituisci tutto l’archivio con questo file.</span></label>`:''}
  <button class="btn primary block" data-act="importa-ok" ${missing.length?'disabled':''}>Importa ${R.length} pazienti</button>`,
  r=>{
    r.querySelectorAll('[data-map]').forEach(s=>s.addEventListener('change',()=>{imp.map[s.dataset.map]=s.value===''?'':+s.value;sheetImport()}));
    r.querySelectorAll('input[name=imode]').forEach(x=>x.addEventListener('change',()=>{imp.mode=x.value}));
  });

function eseguiImport(){
  const R=mappedRows().map(fromRow);
  S.mappe=S.mappe||{}; S.mappe[imp.sig]={...imp.map};
  let nuovi=0, agg=0;
  if(imp.mode==='sostituisci'||!S.pazienti.length){
    S.pazienti=R; nuovi=R.length;
    S.dismissed=initialDismissed(R);
  } else {
    const key=p=>normTxt(p.nome)+'|'+normTxt(p.localita);
    const m=new Map(S.pazienti.map(p=>[key(p),p]));
    for(const r of R){
      const ex=m.get(key(r));
      if(ex){
        for(const k of ['cnt','fg','giorno','ultima','prossima','note','gruppo','gas']) if(r[k]) ex[k]=r[k];
        if(r.spostata) ex.spostata=r.spostata;
        if(r.vacanza) ex.vacanza=r.vacanza;
        if(r.reso) ex.reso=r.reso;
        agg++;
      } else { S.pazienti.push(r); m.set(key(r),r); nuovi++; }
    }
  }
  save(); closeSheet(); imp=null; ui.tab='pazienti'; render();
  toast(`Importati: ${nuovi} nuovi${agg?`, ${agg} aggiornati`:''}.`);
}

  if(t.id==='paz-q'){ui.q=t.value;$('#paz-list').innerHTML=pazListHTML()}

});

function conTimeout(pr,ms){return Promise.race([pr,new Promise(r=>setTimeout(()=>r(null),ms))])}
async function leggiVersione(){
  if(!PWA) return VERSIONE_BASE;
  try{
    const r=await conTimeout(fetch('versione.txt',{cache:'no-store'}),8000);
    if(r && r.ok){const t=(await r.text()).split(/\r?\n/)[0].trim().slice(0,20); if(t) return t;}
  }catch(e){}
  return null;
}
async function controllaAggiornamentoApp(){
  if(!PWA || !('serviceWorker' in navigator)) return;
  try{const reg=await conTimeout(navigator.serviceWorker.getRegistration(),3000); if(reg) await conTimeout(reg.update(),8000);}catch(e){}
}
(async function splash(){
  const sp=$('#splash'); if(!sp) return;
  if(LOGO.startsWith('data:')) $('#splash-logo').src=LOGO; else $('#splash-logo').remove();
  const lbl=$('#splash-lbl'), ver=$('#splash-ver');
  ver.textContent='Versione '+versioneApp;
  caricaMeteoLocale();
  const msg=['Caricamento…','Carico i pazienti…','Preparo il giro…','Quasi pronto…'];
  let i=0, upd=null;
  let fissa=false;
  const t=setInterval(()=>{ if(upd||fissa) return; i=Math.min(i+1,msg.length-1); lbl.textContent=msg[i]; },1250);
  const minimo=new Promise(r=>setTimeout(r,5000));
  const lavoro=(async()=>{
    const v=await leggiVersione();
    if(v){
      let prima=null; try{prima=localStorage.getItem(VKEY)}catch(e){}
      if(prima && prima!==v){ upd=v; lbl.textContent='Aggiornamento alla versione '+v+'…'; lbl.classList.add('upd'); }
      try{localStorage.setItem(VKEY,v)}catch(e){}
      versioneApp=v; ver.textContent='Versione '+v;
    }
    await controllaAggiornamentoApp();
    caricaMeteo();
    if(CLOUD){ if(!upd){fissa=true;lbl.textContent='Collegamento al tuo account…';} await initCloud(); }
  })();
  await Promise.all([minimo,lavoro]);
  clearInterval(t);
  const bar=sp.querySelector('.bar i'); bar.classList.add('fine');
  if(upd){ lbl.textContent='Aggiornato alla versione '+upd; await new Promise(r=>setTimeout(r,1400)); }
  else await new Promise(r=>setTimeout(r,350));
  if(serveLogin) mostraLogin(); else render();
  sp.classList.add('out'); setTimeout(()=>{sp.remove(); if(serveLogin) return; if(CLOUD&&utente&&!utente.nome&&navigator.onLine){sheetPrimoProfilo();return} if(CLOUD&&utente&&(proponiRecupero||!S.pazienti.length)){proponiRecupero=false;sheetRecupero(true);return} popupInstalla(); setTimeout(()=>popupInstalla(true),3000);},500);
})();
if(CLOUD){ S=seedState(); } else { S = load(); save(); }
render();
getDownloads();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
